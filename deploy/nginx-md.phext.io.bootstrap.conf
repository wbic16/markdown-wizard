# md.phext.io — bootstrap site, HTTP only.
#
# deploy/install.sh installs this first so certbot has a live server
# block to work with, obtains the certificate, and then replaces this
# file with deploy/nginx-md.phext.io.conf (the TLS site). This file is
# a means to the certificate, never the steady state.

server {
    listen 80;
    listen [::]:80;
    server_name md.phext.io;
    server_tokens off;

    client_max_body_size 16M;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# md.phext.io — nginx site for markdown-wizard.
#
# deploy/install.sh installs this file (see deploy/DEPLOY.md). It is
# modeled on phext-lattice's deploy/nginx-edit.phext.io.conf: the app
# sets its own Cache-Control, ETag, CSP, and security headers, and
# HSTS when X-Forwarded-Proto is https; nginx hides its version,
# redirects port 80, rate-limits, and sends the one HSTS header.
#
# On Debian/Ubuntu this file is included from the http block, so the
# limit_req_zone lines belong here and the file must not be wrapped
# in another http { }.

limit_req_zone $binary_remote_addr zone=mdwiz_req:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=mdwiz_publish:10m rate=2r/s;

# Port 80 only redirects. Do not proxy_pass here.
server {
    listen 80;
    listen [::]:80;
    server_name md.phext.io;
    server_tokens off;
    return 301 https://md.phext.io$request_uri;
}

server {
    # `http2` on listen works through nginx 1.24 (the awsbox version).
    # On 1.25+ it warns; if `nginx -t` complains, use `listen 443 ssl;`
    # plus `http2 on;` instead.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name md.phext.io;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/md.phext.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/md.phext.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # A bundle is at most 16 MiB; the app enforces the same cap.
    client_max_body_size 16M;

    # The app sends the same value when it sees X-Forwarded-Proto
    # https. Drop that copy so the browser sees one header.
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Publishing is the one write surface; keep it slow and deliberate.
    location /api/publish {
        limit_req zone=mdwiz_publish burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/restore {
        limit_req zone=mdwiz_publish burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=mdwiz_req burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
